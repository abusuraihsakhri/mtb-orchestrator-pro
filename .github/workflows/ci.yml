name: Test Python and Browser

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Install package and test extras
        run: python -m pip install -e ".[server,test]"
      - name: Verify installation and imports
        run: |
          python -m pip check
          python -m compileall -q agents mtb_orchestrator_pro cli.py enrichment.py simulator.py
          mtb-orchestrator-pro --help
          mtb-orchestrator-oncology --help
      - name: Python regression suite
        run: python -m pytest -q
      - name: CLI batch smoke test
        run: |
          mtb-orchestrator-pro batch -i sample.csv -o results.csv
          test -s results.csv

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate browser module
        run: node --check web/app.mjs
      - name: Run browser unit tests
        run: node --test tests/test_web.mjs
