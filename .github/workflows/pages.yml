name: Publish Browser Preview

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live page and JavaScript asset
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          from urllib.request import urlopen

          root = os.environ["PAGE_URL"].rstrip("/") + "/"
          for attempt in range(12):
              try:
                  with urlopen(root, timeout=20) as response:
                      page = response.read().decode("utf-8")
                  with urlopen(root + "app.mjs", timeout=20) as response:
                      script = response.read().decode("utf-8")
                  assert "Local execution" in page
                  assert "export function evaluate" in script
                  print("Live Pages HTML and JavaScript verified at", root)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          PY
