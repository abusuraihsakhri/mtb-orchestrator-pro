services:
  mtb-orchestrator-pro:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: "${AUDIT_SECRET_KEY:?Set a long random AUDIT_SECRET_KEY in your environment}"
      MTB_API_TOKEN: "${MTB_API_TOKEN:?Set a private MTB_API_TOKEN in your environment}"
      MODEL_PROVIDER: mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
