[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mtb-orchestrator-pro"
version = "2.0.1"
description = "Rule-based multi-worker task evaluation, CLI, and optional REST API"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
mtb-orchestrator-pro = "cli:main"
mtb-orchestrator-oncology = "mtb_orchestrator_pro.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/mtb-orchestrator-pro"
Repository = "https://github.com/abusuraihsakhri/mtb-orchestrator-pro"

[tool.setuptools]
packages = ["agents", "mtb_orchestrator_pro"]
py-modules = ["cli", "enrichment", "simulator", "mtb_orchestrator_pro_app"]
